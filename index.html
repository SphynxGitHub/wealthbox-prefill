<body>
    <h2>Wealthbox Sync Setup</h2>
    <div id="authSection">
        <p>Enter your Wealthbox API Access Token:</p>
        <input type="password" id="userWbKey" placeholder="Paste Token Here" style="width: 300px;">
        <button onclick="startMapping()">Next: Map Fields</button>
    </div>

    <div id="mappingSection" style="display:none;">
        <div id="fieldMatcher"></div>
        <button id="finish">Finish Integration</button>
    </div>

    <script>
        let userWbKey = "";

        function startMapping() {
            userWbKey = document.getElementById('userWbKey').value;
            if (!userWbKey) return alert("Please enter a key.");
            document.getElementById('authSection').style.display = 'none';
            document.getElementById('mappingSection').style.display = 'block';
            
            // Trigger the Jotform Question Mapper
            JF.fieldMatch({
                el: document.getElementById("fieldMatcher"),
                targetFields: [
                    { value: "First Name", key: "first_name", type: "control_textbox" },
                    { value: "Last Name", key: "last_name", type: "control_textbox" },
                    { value: "Email", key: "email", type: "control_email" }
                ],
                callback: function(mapping) {
                    document.getElementById('finish').onclick = () => complete(mapping);
                }
            });
        }

        function complete(mapping) {
            const firebaseBase = "https://YOUR_REGION-YOUR_PROJECT.cloudfunctions.net/wealthboxBridge";
            
            // We append the specific user's key AND the map to the URL
            const finalHook = `${firebaseBase}?mapping=${encodeURIComponent(JSON.stringify(mapping))}&wbKey=${encodeURIComponent(userWbKey)}`;
            
            JF.createFormWebhook(urlParams.get('formId'), finalHook, function() {
                JF.complete();
            });
        }
    </script>
</body>
